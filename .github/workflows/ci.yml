# Everyday CI: scripts/check.sh as the maintainer runs it (Bun installed, so
# the conformance tests diff against the reference too; the wasm target and
# wasm-bindgen CLI installed, so the WebAssembly packages are built, loaded
# and tested, and must be), and the viewer's
# check on macOS 27 with Xcode 27.1. The long runs have their own workflows,
# started by hand (TESTING.md, "On GitHub").
name: CI

on:
  push:
    # ci/** branches run the same jobs before a change merges to main, for
    # tests that only run with a display (the worker Mac is headless).
    branches: [main, 'ci/**']
  pull_request:

permissions:
  contents: read

# bash -eo pipefail: a step piped through tee still fails when its command does.
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The maintainer's stable, so clippy's lints here are the ones check.sh
  # passed locally. Move it when the Mac's stable moves.
  RUST: 1.97.1

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      # The WebAssembly packages are built, loaded and tested here: a missing
      # tool fails the check instead of skipping that step.
      OPENUI_REQUIRE_WASM: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Rust
        run: |
          rustup toolchain install "$RUST" --profile minimal -c rustfmt -c clippy -t wasm32-unknown-unknown
          rustup default "$RUST"
          rustup toolchain install 1.88.0 --profile minimal
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: The reference's dependencies
        working-directory: reference
        run: bun install --frozen-lockfile
      # The wasm-bindgen CLI at the version Cargo.lock names, built once per
      # version and kept in its own folder (not ~/.cargo/bin, which rust-cache
      # manages).
      - name: The wasm-bindgen version
        id: wasm-bindgen
        run: echo "version=$(scripts/wasm-bindgen-version.sh)" >> "$GITHUB_OUTPUT"
      - name: The wasm-bindgen CLI from the cache
        id: wasm-bindgen-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.wasm-bindgen-cli
          key: wasm-bindgen-cli-${{ steps.wasm-bindgen.outputs.version }}-${{ runner.os }}
      - name: The wasm-bindgen CLI
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version "${{ steps.wasm-bindgen.outputs.version }}" --locked --root ~/.wasm-bindgen-cli
      # Saved straight away, so a failing check still keeps the slow install.
      - name: The wasm-bindgen CLI into the cache
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.wasm-bindgen-cli
          key: ${{ steps.wasm-bindgen-cache.outputs.cache-primary-key }}
      - run: echo "$HOME/.wasm-bindgen-cli/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check.sh

  viewer:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      # The rendering differential compares against a local `main`. A ci/**
      # branch checkout has none, so fetch it there.
      - if: github.ref != 'refs/heads/main'
        run: git fetch --no-tags --depth=1 origin main:main
      - run: sudo xcode-select -s /Applications/Xcode_27.1.app
      - name: Rust
        run: |
          rustup toolchain install "$RUST" --profile minimal
          rustup default "$RUST"
      - uses: Swatinem/rust-cache@v2
      - name: Test the Swift packages
        timeout-minutes: 40
        env:
          OPENUI_SWIFT_TEST_STACKS: ${{ runner.temp }}/swift-test-stacks
        run: exec scripts/check-viewer.sh
      - name: Reproduce the Intelligent UI text stall
        if: ${{ !cancelled() && github.ref == 'refs/heads/ci/ticket-254-repro' }}
        timeout-minutes: 40
        env:
          OPENUI_SWIFT_TEST_STACKS: ${{ runner.temp }}/swift-test-stacks
        run: exec python3 scripts/check-swift-tests.py --reproduce-text 300
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: swift-test-stacks
          path: ${{ runner.temp }}/swift-test-stacks
          if-no-files-found: ignore
