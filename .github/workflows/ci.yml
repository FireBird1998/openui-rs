# Everyday CI: scripts/check.sh as the maintainer runs it (Bun installed, so
# the conformance tests diff against the reference too), and the viewer's
# check on macOS 27 with Xcode 27.1. The long runs have their own workflows,
# started by hand (TESTING.md, "On GitHub").
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# bash -eo pipefail: a step piped through tee still fails when its command does.
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The maintainer's stable, so clippy's lints here are the ones check.sh
  # passed locally. Move it when the Mac's stable moves.
  RUST: 1.97.1

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Rust
        run: |
          rustup toolchain install "$RUST" --profile minimal -c rustfmt -c clippy
          rustup default "$RUST"
          rustup toolchain install 1.88.0 --profile minimal
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: The reference's dependencies
        working-directory: reference
        run: bun install --frozen-lockfile
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check.sh

  viewer:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - run: sudo xcode-select -s /Applications/Xcode_27.1.app
      - name: Rust
        run: |
          rustup toolchain install "$RUST" --profile minimal
          rustup default "$RUST"
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check-viewer.sh
