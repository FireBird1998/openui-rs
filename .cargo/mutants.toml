# cargo-mutants (testing tickets 04 and 05; scripts/mutants.sh runs it).
#
# Mutants the suite can't catch because they change nothing a caller can
# observe, each with the reason. Reruns skip them. A mutant goes here only
# once it's been shown to change nothing; anything else gets a test.
exclude_re = [
    # Both comparisons choose the same sign for n, which is already infinite.
    'js\.rs:.*: replace > with >= in number_to_string$',
    # At EOF the inner i >= n check breaks before any byte or token is read.
    'lexer\.rs:.*: replace < with <= in tokenize$',
    # Extra Value slots are ignored by extraction and have no state_refs to declare.
    'parser\.rs:.*: replace Info::special -> bool with true$',

    # pair maintains inverse maps: with both lookups present, n == now iff t == then, so AND and OR agree (#15).
    'evaluate\.rs:.*replace && with \|\| in pair',
    # partial occupies bit 0 and expr bit 1, so OR and XOR are identical (#15).
    'table\.rs:.*replace \| with \^ in Cache::index',
    # The stall guard's choice between panicking and cutting, outside unit
    # tests (they use a twin they can switch). Only a stall reaches it, and
    # only a bug in the core stalls, so with one mutant planted at a time
    # nothing does: `true` is what a test build already does, and `false`
    # shows only alongside a second bug (issue #2).
    'progress\.rs:\d+:\d+: replace panics -> bool with (true|false)',
    # Keeping the comment's newline adds only leading whitespace, trimmed by every caller before recognizing a statement (#13).
    'preprocess\.rs:.*replace \+ with \* in after_comment_lines',
    # Called only on a known backslash: skipping its absent next byte early preserves quote state; a later push skips that same escaped byte, and a finished line resets the cursor (#13).
    'preprocess\.rs:.*replace (< with <=|\+ with \*) in has_escape_byte',
    # The caller already checked for a backslash; true only skips a trailing backslash's future byte early, with identical state and output (#13).
    'preprocess\.rs:.*replace has_escape_byte -> bool with true',
    # Deleting either arm retains a definite prefix and recomputes the same Yes/No; only performance-irrelevant recomputation changes (#13).
    'preprocess\.rs:.*delete match arm Starts::(Yes|No) in Block::add',
    # Both < comparisons in split guard EOF-terminated scanning; EOF stops before pos reaches n (and the outer check handles empty tokens) (#13).
    'statements\.rs:.*replace < with <= in split',
    # The current token is a newline, so skipping from pos or pos + 1 reaches the same first non-newline (#13).
    'statements\.rs:.*replace \+ with \* in after_newline',
    # One more merging pass once runs span the whole list (width == n) only copies the one sorted run (#12).
    'evaluate\.rs:.*replace < with <= in runs_to_merge',
    # Both callers subsequently draw positive work before returning any value; zero work or an existing cut therefore still cuts the same default (#11).
    'evaluate\.rs:.*replace out_of_work -> bool with false',
    # The fallback walks json_shaped(props), which finds the same dynamic values as walking plain-object props directly; only extra copying changes (#14).
    'validation\.rs:.*delete match arm Some\(Value::Obj\(p\)\) in element_parts',
    # RuntimeRef is produced by resolution and never fed back into materialization; retain non-panicking defensive pricing (#14).
    'materialize\.rs:.*(in runtime_ref_size$|replace runtime_ref_size -> usize)',
]
