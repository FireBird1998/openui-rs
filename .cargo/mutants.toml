# cargo-mutants (testing tickets 04, 05 and runtime #40; scripts/mutants.sh runs it).
#
# Mutants the suite can't catch because they change nothing a caller can
# observe, each with the reason. Reruns skip them. A mutant goes here only
# once it's been shown to change nothing; anything else gets a test.
# Runtime #40 first-batch exclusions below were audited through public paths;
# list mode alone never establishes equivalence. Later survivor batches still
# need their own regressions or equivalence arguments.
exclude_re = [
    # Both comparisons choose the same sign for n, which is already infinite.
    'js\.rs:.*: replace > with >= in number_to_string$',
    # At EOF the inner i >= n check breaks before any byte or token is read.
    'lexer\.rs:.*: replace < with <= in tokenize$',
    # Extra Value slots are ignored by extraction and have no state_refs to declare.
    'parser\.rs:.*: replace Info::special -> bool with true$',

    # pair maintains inverse maps: with both lookups present, n == now iff t == then, so AND and OR agree (#15).
    'evaluate\.rs:.*replace && with \|\| in pair$',
    # partial occupies bit 0 and expr bit 1, so OR and XOR are identical (#15).
    'table\.rs:.*replace \| with \^ in Cache::index$',
    # The stall guard's choice between panicking and cutting, outside unit
    # tests (they use a twin they can switch). Only a stall reaches it, and
    # only a bug in the core stalls, so with one mutant planted at a time
    # nothing does: `true` is what a test build already does, and `false`
    # shows only alongside a second bug (issue #2).
    'progress\.rs:\d+:\d+: replace panics -> bool with (true|false)$',
    # Keeping the comment's newline adds only leading whitespace, trimmed by every caller before recognizing a statement (#13).
    'preprocess\.rs:.*replace \+ with \* in after_comment_lines$',
    # Called only on a known backslash: skipping its absent next byte early preserves quote state; a later push skips that same escaped byte, and a finished line resets the cursor (#13).
    'preprocess\.rs:.*replace (< with <=|\+ with \*) in has_escape_byte$',
    # The caller already checked for a backslash; true only skips a trailing backslash's future byte early, with identical state and output (#13).
    'preprocess\.rs:.*replace has_escape_byte -> bool with true$',
    # Deleting either arm retains a definite prefix and recomputes the same Yes/No; only performance-irrelevant recomputation changes (#13).
    'preprocess\.rs:.*delete match arm Starts::(Yes|No) in Block::add$',
    # Both < comparisons in split guard EOF-terminated scanning; EOF stops before pos reaches n (and the outer check handles empty tokens) (#13).
    'statements\.rs:.*replace < with <= in split$',
    # The current token is a newline, so skipping from pos or pos + 1 reaches the same first non-newline (#13).
    'statements\.rs:.*replace \+ with \* in after_newline$',
    # One more merging pass once runs span the whole list (width == n) only copies the one sorted run (#12).
    'evaluate\.rs:.*replace < with <= in runs_to_merge$',
    # A recovered whole RanOut record has only null followers once invalid
    # prefixes have been discarded. Comparing their old inputs still evaluates
    # them with the same allowance/result. Only small extra comparisons change;
    # neither charged work nor a reliable generous timing ratio distinguishes it.
    'evaluate\.rs:.*replace != with == in state_defaults$',
    # validate_schema_value returns an AST unchanged before validation (as does
    # reference validateSchemaValue); object/array children clone that same Arc.
    # Schema defaults create JSON Values, never Value::Ast, and literal_value
    # in mapCallArgs cannot produce ASTs. Distinct-but-equal AST pairs are thus
    # unreachable. Structural fallback only revisits the same AST; NaN can cause
    # a redundant enclosing-container copy with unchanged children. Neither
    # serialized values nor priced work changes; no reliable timing ratio pins it.
    'materialize\.rs:.*delete match arm \(Value::Ast\(x\), Value::Ast\(y\)\) in js_strict_eq$',
    # The fallback walks json_shaped(props), which finds the same dynamic values as walking plain-object props directly; only extra copying changes (#14).
    'validation\.rs:.*delete match arm Some\(Value::Obj\(p\)\) in element_parts$',
    # RuntimeRef is produced by resolution and never fed back into materialization; retain non-panicking defensive pricing (#14).
    'materialize\.rs:.*(in runtime_ref_size|replace runtime_ref_size -> usize with [0-9]+)$',

    # These decrement mutants only overestimate the orphan count (division is
    # by 1). The count only skips an exact scan at zero; versions still
    # invalidate the memo and orphaned() uses the unchanged per-slot reach.
    # Output and charged limits are identical; only an occasional extra scan
    # remains, alongside the result's existing error/reach walks.
    'table\.rs:.*replace -= with (\+=|/=) in Table::orphan_change$',
    'table\.rs:.*replace -= with (\+=|/=) in Table::reach_inc$',
    # OR only adds spurious orphan/version increments, including for the
    # entry; it cannot hide a real orphan. The exact scan above still wins.
    'table\.rs:.*replace && with \|\| in Table::reach_dec$',

    # Reversing this predicate merely discards invalidated followers sooner on
    # Whole/TooDeep and recomputes zero-allowance followers on RanOut. Values,
    # priced work, and a reliable generous timing ratio are unchanged.
    'evaluate\.rs:.*replace == with != in followers_are_forced_null$',

    # Runtime #40, first batch. This allocator exists only in the cfg(test)
    # unit-test harness; changing its ceiling has no production/public effect.
    'crates/openui-runtime/src/lib\.rs:\d+:78: replace \* with \+$',
    # A quoted name exceeds its raw length. Every text caller subsequently
    # charges the quoted name plus a separator against the same total ceiling;
    # prompt extraction first admits the whole spec. These early size edges
    # cannot admit/refuse a different registry or alter its typed size flags.
    # The work comparison (column 19) remains observable and is NOT excluded.
    'crates/openui-runtime/src/admission\.rs:\d+:63: replace > with >= in text$',
    'crates/openui-runtime/src/admission\.rs:\d+:14: replace > with == in text$',
    'crates/openui-runtime/src/admission\.rs:\d+:14: replace > with >= in text$',
    # The fallback's own_fields borrows an Obj and feeds identical fields to
    # component, with identical output/limits. Retain the fast arm to avoid an
    # empty JsObject initialization (and its unpriced hasher setup); A.3's
    # stricter allocation-count preservation is not claimed for this rewrite.
    "crates/openui-runtime/src/tree\\.rs:.*: delete match arm Value::Obj\\(fields\\) in <impl EvaluationScope for TreeScope<'_>>::call_value_named$",
    # The core calls each_item_owned only after wants_each_item accepted a
    # dynamic element in call context, so both guard operands are false. AND
    # skips an unpriced evaluator-context query/bridge-collection opportunity.
    # Retain this context touch rather than change its bridge-collection
    # opportunities; its housekeeping cost is not priced evaluation work.
    "crates/openui-runtime/src/tree\\.rs:.*: replace \\|\\| with && in <impl EvaluationScope for TreeScope<'_>>::each_item_owned$",
    # Only fresh projections change this conjunct. The core has already priced
    # and measured their marker bodies; rechecking them uses those measurements
    # inside the item's temporary room, dominated by its complete projection.
    # Dual-tag fresh objects take element projection first. Dropping this memo
    # repeats admission/weak-map bookkeeping, without changing bytes, flags or
    # priced work/room. Borrowed aliases ARE observable (the two OR mutants).
    "crates/openui-runtime/src/tree\\.rs:\\d+:37: delete ! in TreeScope<'_>::component$",
    # At equal remaining depth the already-admitted marker still fits. An
    # additional DepthOnly check consumes neither work, output room nor memory.
    "crates/openui-runtime/src/tree\\.rs:.*: replace < with <= in TreeScope<'_>::reserve_marker$",
    # A completed intermediate array enters the unpaid walk with runtime_value's
    # live, one-use root projection receipt. It is consumed exactly once; its
    # element sizes are part of that same projection. The missing-receipt
    # punctuation fallback cannot run on these public tree paths.
    "crates/openui-runtime/src/tree\\.rs:\\d+:28: delete ! in TreeScope<'_>::unpaid_expression_result$",
    # A retained Weak keeps its allocation's address unavailable for reuse.
    # A live value therefore cannot match a dead entry. Accepting dead owners
    # changes only collection/weak-table cost, outside ADR 0011's account.
    'crates/openui-runtime/src/tree\.rs:.*: replace ElementOwner::alive -> bool with true$',
    # Sweep frequency and retaining dead Weak slots are unpriced authority-table
    # bookkeeping (ADR 0011), with no asserted slot count or timing contract.
    # owns still upgrades the Weak and checks the exact live Arc, so neither
    # mutation grants/revokes authority or changes bytes/work/room/cut flags.
    'crates/openui-runtime/src/tree/actions\.rs:.*: replace >= with < in Provenance::mark$',
    'crates/openui-runtime/src/tree/actions\.rs:.*: replace > with >= in Provenance::mark$',
    # field reads Element only to distinguish custom_action steps in own_plan:
    # both "element" and absent are non-custom. Its n/refType callers first
    # require kind(StateRef/RuntimeRef), which rejects Element. These guards
    # change only a tiny temporary text allocation, never the retained plan.
    'crates/openui-runtime/src/tree/actions\.rs:.*: replace match guard key == "type" with false in field$',
    'crates/openui-runtime/src/tree/actions\.rs:.*: replace == with != in field$',

    # Runtime #40, second batch. Public paths and scratch controls are documented
    # in TESTING.md; list-mode set differences check every exclusion below.
    # Changing the second OR leaves the failure check intact. A size/depth cut is sticky;
    # the immediately following copy_text fails before copying any argument name. The later
    # schema/output admission observes the same cut. Only construction of an empty temporary
    # record before returning the empty plan can differ; this unpriced bookkeeping has no
    # allocation-count contract.
    "crates/openui-runtime/src/tree/actions\\.rs:\\d+:68: replace \\|\\| with && in TreeScope<'a>::declared_call$",
    # Changing the second OR leaves the failure check intact. A size/depth cut is sticky;
    # the immediately following copy_text fails before copying any argument name. The later
    # schema/output admission observes the same cut. Only construction of an empty temporary
    # record before returning the empty plan can differ; this unpriced bookkeeping has no
    # allocation-count contract.
    "crates/openui-runtime/src/tree/actions\\.rs:\\d+:72: replace \\|\\| with && in TreeScope<'a>::declared_call$",
    # cacheable_arguments can be true only with share_arguments. With a unique evaluated
    # argument object, retaining a weak cache source cannot produce a future hit: it has no
    # surviving external owner, and Weak prevents address reuse. At most one transformed
    # validation result lives until replacement/end of this operation. Only this unpriced
    # cache retention changes; output, flags and the cumulative evaluation account are
    # unchanged.
    "crates/openui-runtime/src/tree/actions\\.rs:\\d+:48: replace && with \\|\\| in TreeScope<'a>::declared_call$",
    # possible_name rejects a name longer than all retained entry bytes combined, which
    # cannot name a retained field/form. __proto__ is explicitly exempted; other inherited
    # functions still project to None. Removing one early rejection only hashes/walks an
    # impossible name; there is no timing contract for this lookup.
    "crates/openui-runtime/src/tree/form\\.rs:\\d+:9: replace \\|\\| with && in get_field_value$",
    # copy_text charges raw text length plus one. At raw length equal to the whole work
    # allowance it must refuse too; above that allowance it also refuses before copying.
    # This preflight only avoids scanning JSON escapes, outside the priced evaluation work.
    "crates/openui-runtime/src/tree/input\\.rs:\\d+:19: replace > with == in text_size$",
    # copy_text charges raw text length plus one. At raw length equal to the whole work
    # allowance it must refuse too. This preflight only avoids scanning JSON escapes,
    # outside the priced evaluation work.
    "crates/openui-runtime/src/tree/input\\.rs:\\d+:19: replace > with >= in text_size$",
    # Every caller reserves the quoted bytes as both work and room, then copies text for
    # additional work. At bytes == max(room, work), reservation exhausts or exceeds work;
    # above it reservation also refuses. Changing this preflight preserves size flags and
    # prevents no successful copy.
    "crates/openui-runtime/src/tree/input\\.rs:\\d+:14: replace > with == in text_size$",
    # Every caller reserves the quoted bytes as both work and room, then copies text for
    # additional work. At bytes == max(room, work), reservation exhausts or exceeds work;
    # above it reservation also refuses. Changing this preflight preserves size flags and
    # prevents no successful copy.
    "crates/openui-runtime/src/tree/input\\.rs:\\d+:14: replace > with >= in text_size$",

    # QueryManager::complete clears run_again when no unsuspended query holds
    # the key (including a suspended-only key). Otherwise it ends the pending
    # call. take_remembered runs before reader propagation or dispatch, so
    # whenever run_again.take()? succeeds, read is true and pending is None.
    # Widening the reader predicate or changing the final guard has no effect (#198).
    'crates/openui-runtime/src/query/runs\.rs:\d+:43: replace && with \|\| in QueryManager::take_remembered$',
    'crates/openui-runtime/src/query/runs\.rs:\d+:18: replace \|\| with && in QueryManager::take_remembered$',

    # Query statement expressions and @Each templates are Ast. Even when a
    # nested host function or Action evaluates its arguments via the descriptor
    # evaluator, its syntax children are Value::Ast and dispatch back to typed
    # evaluation. Objects returned by a provider, store or host stay values.
    # Only an untyped Comp descriptor asks this hook for permission (#194).
    "crates/openui-runtime/src/query\\.rs:\\d+:9: replace <impl EvaluationScope for QueryScope<'_, '_>>::wants_unmapped_call -> bool with (true|false)$",
]

# Query manager (#95): five equivalent mutants that exclude_re cannot skip.
# cargo-mutants 27.1.0 lists "delete field" mutants whatever exclude_re says
# (scripts/mutants.sh query --list --exclude-re 'delete field' still lists
# them), so these are recorded here and expected in missed.txt. Each deletes
# a field whose written value equals what `..QueryUpdate::default()` supplies
# (an empty calls vector, a false changed flag), so no update changes.
# Removing the explicit field from the source removes the mutant.
#   query/refresh.rs     idle_update: calls, changed
#   query/mutations.rs   register_mutations: calls
#   query/mutations.rs   fire_mutation, the unknown-or-loading branch: calls, changed
