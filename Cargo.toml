[workspace]
members = ["crates/openui-lang", "crates/openui-ffi", "crates/test-alloc"]
# cargo-fuzz targets build on nightly with their own settings.
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
edition = "2024"
# let-chains (`if let … && …`) need 1.88.
rust-version = "1.88"
license = "MIT"

[profile.release]
lto = true
codegen-units = 1

# Tests walk every prefix of a 64 KB corpus; unoptimized builds make that slow.
[profile.test]
opt-level = 1

