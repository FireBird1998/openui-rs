[workspace]
members = ["crates/openui-lang", "crates/openui-ffi"]
# cargo-fuzz targets build on nightly with their own settings.
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
edition = "2024"
# let-chains (`if let … && …`) need 1.88.
rust-version = "1.88"
license = "MIT"

[profile.release]
lto = true
codegen-units = 1

# Tests walk every prefix of a 64 KB corpus; unoptimized builds make that slow.
[profile.test]
opt-level = 1

# Our own trees grow the stack and free themselves without recursion (ADR
# 0002), but reading JSON back still goes through serde_json's value, which
# drops recursively: fine optimized, too deep for a small stack at opt-level
# 0. Kept until reading JSON and the evaluator stop using it (#6, #7).
[profile.dev.package.openui-lang]
opt-level = 1
[profile.dev.package.openui-ffi]
opt-level = 1
