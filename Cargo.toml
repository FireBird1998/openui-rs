[workspace]
members = ["crates/openui-lang"]
# cargo-fuzz targets build on nightly with their own settings.
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"

[profile.release]
lto = true
codegen-units = 1

# Tests walk every prefix of a 64 KB corpus; unoptimized builds make that slow.
[profile.test]
opt-level = 1

# Recursion stays inside small thread stacks only when optimized (see tests/depth.rs).
[profile.dev.package.openui-lang]
opt-level = 1
