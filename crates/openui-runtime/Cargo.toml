[package]
name = "openui-runtime"
version = "0.1.0"
description = "OpenUI Lang runtime over the core's expression evaluator"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
query-audit = ["openui-lang/query-audit"]

[dependencies]
openui-lang = { path = "../openui-lang" }

[dev-dependencies]
# Enable the hidden cache audit for integration tests as well as unit tests.
openui-runtime = { path = ".", features = ["query-audit"] }
test-alloc = { path = "../test-alloc" }
