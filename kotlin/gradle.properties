android.useAndroidX=true
android.nonTransitiveRClass=true
# Gradle shares a Mac with other builds: keep its heap bounded, and compile
# Kotlin inside Gradle's process rather than in a Kotlin daemon that would
# outlive the build.
org.gradle.jvmargs=-Xmx3g
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
